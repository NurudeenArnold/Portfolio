<form [formGroup]="form" (ngSubmit)="submit()">
    <label for="fullName">Full Name:</label><br>
    <input type="text" id="fullName" formControlName="name" placeholder="Nurudeen Arnold" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" formControlName="email" placeholder="example@gmail.com" required><br><br>

    <label for="message">Message:</label><br>
    <textarea id="message" formControlName="message" rows="4" cols="50" required></textarea><br><br>

    <input class="btn" type="submit" [value]="sending() ? 'Sending…' : 'Submit'" [disabled]="sending()">
</form>
